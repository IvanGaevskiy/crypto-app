AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3.1
  Exclude:
    - "db/schema.rb"
    - "spec/**/*"
    - "test/**/*"
    - "vendor/**/*"
    - ".bundle/**/*"
    - "node_modules/**/*"

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Style/OptionalBooleanParameter:
  Enabled: true
Style/BlockDelimiters:
  Enabled: true

Layou/LineLength:
  Max: 120

Lint/UselessAssignment:
  Enabled: true

Style/Documentation:
  Enabled: false
